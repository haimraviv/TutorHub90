<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Materials — TutorHub90</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<div class="topbar">
  <div style="display:flex; align-items:center; gap:16px;">
    <a href="../index.html" class="back-link">← Back to Dashboard</a>
    <span style="color:#fff; font-weight:700; font-family:'Source Serif 4',serif; font-size:18px;">Course Materials</span>
  </div>
  <div class="session-info">
    <span id="mat-session-email"></span>
    <span class="badge-role" id="mat-session-role"></span>
  </div>
</div>

<div class="page-wrap">
  <div id="mat-global-alert"></div>
  <div id="mat-loading" class="empty-state">Loading…</div>

  <!-- TUTOR VIEW -->
  <div id="tutor-materials-view" class="hidden">
    <div class="section-header"><h2>Course Materials</h2></div>
    <div class="grid-2">
      <div class="card">
        <div class="section-header"><h2 style="font-size:17px;">Add Material</h2></div>
        <form id="form-add-material">
          <div class="field">
            <label for="mat-title">Title</label>
            <input type="text" id="mat-title" required placeholder="e.g. Week 3 — Algebra Review">
          </div>

          <div class="field">
            <label>Source</label>
            <div class="mode-tabs">
              <div class="mode-tab active" data-mode="upload">Upload File</div>
              <div class="mode-tab" data-mode="link">Paste Link</div>
            </div>
          </div>

          <div id="upload-fields">
            <div class="field">
              <label for="mat-file">File (PDF, Word doc, ZIP, video, image — anything)</label>
              <input type="file" id="mat-file">
              <div class="hint">Type is detected automatically from the file.</div>
            </div>
          </div>

          <div id="link-fields" class="hidden">
            <div class="field">
              <label for="mat-url">URL</label>
              <input type="url" id="mat-url" placeholder="https://... or a YouTube link">
            </div>
            <div class="field">
              <label for="mat-type">Type</label>
              <select id="mat-type">
                <option value="Link">Website / Link</option>
                <option value="PDF">PDF</option>
                <option value="Video">Video</option>
              </select>
            </div>
          </div>

          <div id="upload-progress-wrap" class="hidden field">
            <div class="progress-track"><div class="progress-fill" id="upload-progress-fill"></div></div>
            <div class="hint" id="upload-progress-text">Uploading…</div>
          </div>

          <div class="field">
            <label>Assign to Students</label>
            <div class="checkbox-list" id="assign-checkbox-list"><div class="empty-state">Loading students…</div></div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary full-w" id="add-material-btn">Add Material</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="section-header">
          <h2 style="font-size:17px;">Materials</h2>
          <span class="count" id="material-count"></span>
        </div>
        <div class="list" id="materials-list"><div class="empty-state">Loading materials…</div></div>
      </div>
    </div>
  </div>

  <!-- STUDENT VIEW -->
  <div id="student-materials-view" class="hidden">
    <div class="section-header">
      <h2 id="student-mat-title">Materials</h2>
      <span class="count" id="student-material-count"></span>
    </div>
    <div class="card">
      <div class="list" id="student-materials-list"><div class="empty-state">Loading materials…</div></div>
    </div>
  </div>

  <!-- ERROR VIEW -->
  <div id="error-view" class="hidden alert alert-error" style="margin-top:16px;"></div>
</div>

<script type="module">
// =====================================================================
// FIREBASE CONFIGURATION — same project as the main app.
// =====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyAg-Dx8YM8b6QsbQA9Dv-fsE4zk8S0U8vw",
  authDomain: "tutorhub90-faf83.firebaseapp.com",
  projectId: "tutorhub90-faf83",
  storageBucket: "tutorhub90-faf83.firebasestorage.app",
  messagingSenderId: "693714545924",
  appId: "1:693714545924:web:deb6fff4d23b112ca2f451",
  measurementId: "G-34G71QNPZM"
};

// =====================================================================
// CLOUDINARY CONFIGURATION — used for file uploads (free tier, no card).
// Fill these in from your Cloudinary dashboard (see setup notes).
// =====================================================================
const CLOUDINARY_CLOUD_NAME = "jsuoiipz";       // e.g. "dabc123xy"
const CLOUDINARY_UPLOAD_PRESET = "ml_default";    // an UNSIGNED upload preset you create

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, collection, query, where, getDocs, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}
function showAlert(type, msg) {
  $("mat-global-alert").innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}

let currentUser = null;
let currentUserDoc = null;
let cachedStudents = [];       // tutor mode: this tutor's enrollments
let currentEnrollment = null;  // student mode: the tutor context we were sent here for

const params = new URLSearchParams(window.location.search);
const enrollmentIdParam = params.get("enrollmentId");

// =====================================================================
// ROUTE ON AUTH STATE
// =====================================================================
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    // Not signed in — bounce back to the login screen.
    window.location.href = "../index.html";
    return;
  }
  currentUser = user;

  const userSnap = await getDoc(doc(db, "users", user.uid));
  if (!userSnap.exists()) {
    window.location.href = "../index.html";
    return;
  }
  currentUserDoc = userSnap.data();

  $("mat-session-email").textContent = currentUserDoc.email;
  $("mat-session-role").textContent = currentUserDoc.role;
  $("mat-loading").classList.add("hidden");

  if (currentUserDoc.role === "tutor") {
    $("tutor-materials-view").classList.remove("hidden");
    await initTutorView();
  } else if (currentUserDoc.role === "student") {
    if (!enrollmentIdParam) {
      showError("No tutor context was given. Go back to your dashboard and click Open Materials again.");
      return;
    }
    const enrollSnap = await getDoc(doc(db, "enrollments", enrollmentIdParam));
    if (!enrollSnap.exists() || enrollSnap.data().studentId !== user.uid) {
      showError("This materials link isn't valid for your account.");
      return;
    }
    currentEnrollment = { id: enrollSnap.id, ...enrollSnap.data() };
    if (currentEnrollment.status !== "active") {
      showError("Your connection with this tutor is still pending approval. Once they activate it, materials will appear here.");
      return;
    }
    $("student-materials-view").classList.remove("hidden");
    $("student-mat-title").textContent = `Materials — ${currentEnrollment.tutorName || currentEnrollment.tutorEmail}`;
    await loadStudentMaterials();
  }
});

function showError(msg) {
  const el = $("error-view");
  el.textContent = msg;
  el.classList.remove("hidden");
}

// =====================================================================
// TUTOR VIEW
// =====================================================================
async function initTutorView() {
  await loadActiveStudentsForAssign();
  await loadTutorMaterials();
  setupModeToggle();
  setupSubmitHandler();
}

async function loadActiveStudentsForAssign() {
  const wrap = $("assign-checkbox-list");
  try {
    const q = query(collection(db, "enrollments"), where("tutorId", "==", currentUser.uid));
    const snap = await getDocs(q);
    cachedStudents = snap.docs.map(d => {
      const data = d.data();
      return { enrollmentId: d.id, studentId: data.studentId, name: data.studentName, email: data.studentEmail, status: data.status };
    });
    const active = cachedStudents.filter(s => s.status === "active");
    if (active.length === 0) {
      wrap.innerHTML = `<div class="empty-state">No active students yet. Activate a student from your dashboard first.</div>`;
      return;
    }
    wrap.innerHTML = active.map(s => `
      <label class="checkbox-row">
        <input type="checkbox" value="${s.studentId}" class="assign-checkbox">
        <span>${escapeHtml(s.name || s.email)}</span>
      </label>
    `).join("");
  } catch (err) {
    wrap.innerHTML = `<div class="empty-state">Couldn't load students. ${escapeHtml(err.message)}</div>`;
  }
}

function setupModeToggle() {
  const form = $("form-add-material");
  form.dataset.mode = "upload";
  document.querySelectorAll(".mode-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      form.dataset.mode = tab.dataset.mode;
      document.querySelectorAll(".mode-tab").forEach(t => t.classList.toggle("active", t === tab));
      $("upload-fields").classList.toggle("hidden", form.dataset.mode !== "upload");
      $("link-fields").classList.toggle("hidden", form.dataset.mode !== "link");
    });
  });

  // Auto-suggest the type from a pasted URL (YouTube/Vimeo → Video, .pdf → PDF).
  $("mat-url").addEventListener("blur", () => {
    const url = $("mat-url").value.trim().toLowerCase();
    if (!url) return;
    if (/youtube\.com|youtu\.be|vimeo\.com/.test(url)) {
      $("mat-type").value = "Video";
    } else if (url.endsWith(".pdf")) {
      $("mat-type").value = "PDF";
    }
  });
}

function detectTypeFromFile(file) {
  const name = (file.name || "").toLowerCase();
  const mime = file.type || "";
  if (mime === "application/pdf" || name.endsWith(".pdf")) return "PDF";
  if (name.endsWith(".doc") || name.endsWith(".docx") || mime.includes("word")) return "DOCX";
  if (name.endsWith(".zip") || mime.includes("zip")) return "ZIP";
  if (mime.startsWith("video/") || /\.(mp4|mov|avi|mkv|webm)$/.test(name)) return "Video";
  if (mime.startsWith("image/") || /\.(png|jpg|jpeg|gif|webp)$/.test(name)) return "Image";
  return "File";
}

// Uploads a file directly from the browser to Cloudinary using an unsigned
// upload preset (no server, no secret key exposed). Uses XMLHttpRequest
// instead of fetch so we can report real upload progress.
function uploadToCloudinary(file, onProgress) {
  return new Promise((resolve, reject) => {
    const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

    const xhr = new XMLHttpRequest();
    xhr.open("POST", url);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) {
        onProgress(Math.round((e.loaded / e.total) * 100));
      }
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          const data = JSON.parse(xhr.responseText);
          resolve(data.secure_url);
        } catch {
          reject(new Error("Unexpected response from Cloudinary."));
        }
      } else {
        let message = `Upload failed (status ${xhr.status}).`;
        try {
          const data = JSON.parse(xhr.responseText);
          if (data?.error?.message) message = data.error.message;
        } catch { /* ignore parse errors, use default message */ }
        reject(new Error(message));
      }
    };
    xhr.onerror = () => reject(new Error("Network error during upload."));
    xhr.send(formData);
  });
}

function setupSubmitHandler() {
  $("form-add-material").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("mat-global-alert").innerHTML = "";
    const mode = $("form-add-material").dataset.mode;
    const title = $("mat-title").value.trim();
    const assignedStudents = Array.from(document.querySelectorAll(".assign-checkbox:checked")).map(cb => cb.value);
    const btn = $("add-material-btn");

    if (assignedStudents.length === 0) {
      showAlert("warn", "Select at least one active student to assign this material to.");
      return;
    }

    let type, url, source, fileName = null;

    if (mode === "link") {
      url = $("mat-url").value.trim();
      type = $("mat-type").value;
      source = "link";
      if (!url) {
        showAlert("warn", "Paste a URL, or switch to Upload File.");
        return;
      }
    } else {
      const file = $("mat-file").files[0];
      if (!file) {
        showAlert("warn", "Choose a file to upload, or switch to Paste Link.");
        return;
      }
      type = detectTypeFromFile(file);
      source = "upload";
      fileName = file.name;
    }

    if (mode === "upload" && (!CLOUDINARY_CLOUD_NAME || !CLOUDINARY_UPLOAD_PRESET)) {
      showAlert("error", "File uploads aren't configured yet — add your Cloudinary cloud name and upload preset at the top of this page's code.");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Adding…";

    try {
      if (mode === "upload") {
        const file = $("mat-file").files[0];
        $("upload-progress-wrap").classList.remove("hidden");
        url = await uploadToCloudinary(file, (pct) => {
          $("upload-progress-fill").style.width = `${pct}%`;
          $("upload-progress-text").textContent = `Uploading… ${pct}%`;
        });
      }

      await addDoc(collection(db, "materials"), {
        title, type, url, source, fileName,
        tutorId: currentUser.uid,
        assignedStudents,
        createdAt: serverTimestamp()
      });

      $("form-add-material").reset();
      $("upload-progress-wrap").classList.add("hidden");
      $("upload-progress-fill").style.width = "0%";
      await loadTutorMaterials();
      showAlert("success", "Material added and assigned successfully.");
    } catch (err) {
      showAlert("error", `Couldn't add material: ${escapeHtml(err.message)}`);
    } finally {
      btn.disabled = false;
      btn.textContent = "Add Material";
    }
  });
}

async function loadTutorMaterials() {
  const listEl = $("materials-list");
  listEl.innerHTML = `<div class="empty-state">Loading materials…</div>`;
  try {
    const q = query(collection(db, "materials"), where("tutorId", "==", currentUser.uid));
    const snap = await getDocs(q);
    const materials = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    materials.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

    $("material-count").textContent = `${materials.length} total`;

    if (materials.length === 0) {
      listEl.innerHTML = `<div class="empty-state">You haven't added any course materials yet.</div>`;
      return;
    }

    listEl.innerHTML = materials.map(m => {
      const names = m.assignedStudents.map(uid => {
        const s = cachedStudents.find(st => st.studentId === uid);
        return s ? (s.name || s.email) : "Unknown student";
      }).join(", ");
      const sourceNote = m.source === "upload" ? ` · Uploaded file${m.fileName ? " (" + escapeHtml(m.fileName) + ")" : ""}` : "";
      return `
        <div class="list-item">
          <div>
            <div class="title">${escapeHtml(m.title)}</div>
            <div class="meta">Assigned to: ${escapeHtml(names || "—")}${sourceNote}</div>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <span class="type-pill type-${m.type}">${escapeHtml(m.type)}</span>
            <a href="${escapeHtml(m.url)}" target="_blank" rel="noopener" class="btn btn-ghost btn-small">Open</a>
          </div>
        </div>
      `;
    }).join("");
  } catch (err) {
    listEl.innerHTML = `<div class="empty-state">Couldn't load materials. ${escapeHtml(err.message)}</div>`;
  }
}

// =====================================================================
// STUDENT VIEW (read-only)
// =====================================================================
async function loadStudentMaterials() {
  const listEl = $("student-materials-list");
  listEl.innerHTML = `<div class="empty-state">Loading materials…</div>`;
  try {
    const q = query(collection(db, "materials"), where("assignedStudents", "array-contains", currentUser.uid));
    const snap = await getDocs(q);
    const materials = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(m => m.tutorId === currentEnrollment.tutorId);
    materials.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

    $("student-material-count").textContent = `${materials.length} total`;

    if (materials.length === 0) {
      listEl.innerHTML = `<div class="empty-state">This tutor hasn't assigned any materials yet.</div>`;
      return;
    }

    listEl.innerHTML = materials.map(m => `
      <div class="list-item">
        <div><div class="title">${escapeHtml(m.title)}</div></div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="type-pill type-${m.type}">${escapeHtml(m.type)}</span>
          <a href="${escapeHtml(m.url)}" target="_blank" rel="noopener" class="btn btn-primary btn-small">Open</a>
        </div>
      </div>
    `).join("");
  } catch (err) {
    listEl.innerHTML = `<div class="empty-state">Couldn't load materials. ${escapeHtml(err.message)}</div>`;
  }
}
</script>
</body>
</html>
